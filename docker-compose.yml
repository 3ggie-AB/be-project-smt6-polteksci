services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: netmonitor
      MYSQL_USER: netmonitor
      MYSQL_PASSWORD: netmonitor
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/001_mysql_observability.sql:/docker-entrypoint-initdb.d/001_mysql_observability.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-unetmonitor", "-pnetmonitor"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: netmonitor
      MYSQL_PASSWORD: netmonitor
      MYSQL_DATABASE: netmonitor
    ports:
      - "8080:8080"

volumes:
  mysql_data:
